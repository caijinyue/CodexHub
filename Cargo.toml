[package]
name = "codexhub"
version = "0.1.0"
edition = "2021"
description = "Multi CODEX_HOME profile manager for OpenAI Codex CLI"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
fs_extra = "1"
humansize = "2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
